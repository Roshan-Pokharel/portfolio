<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <linearGradient id="swBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="swShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="700" height="500" fill="url(#swBg)" />

  <g transform="translate(40, 35)" filter="url(#swShadow)">
    <rect width="620" height="430" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Title bar -->
    <rect width="620" height="38" rx="14" fill="#064e3b" fill-opacity="0.5" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="5" fill="#10b981" />
    <text x="310" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a7f3d0" text-anchor="middle">sawarisaathi.com — Vehicle Rental &amp; Mobility Hub</text>

    <!-- Top Stats Row -->
    <g transform="translate(20, 52)">
      <!-- Stat 1 -->
      <rect x="0" y="0" width="180" height="65" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" fill="#9ca3af">Active Rentals Today</text>
      <text x="16" y="50" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#34d399">128+</text>
      <circle cx="150" cy="32" r="14" fill="#064e3b" />
      <path d="M144 32 L148 36 L156 28" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" />

      <!-- Stat 2 -->
      <rect x="200" y="0" width="180" height="65" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <text x="216" y="24" font-family="'Inter', sans-serif" font-size="10" fill="#9ca3af">Fleet Availability</text>
      <text x="216" y="50" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#38bdf8">94.2%</text>

      <!-- Stat 3 -->
      <rect x="400" y="0" width="180" height="65" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <text x="416" y="24" font-family="'Inter', sans-serif" font-size="10" fill="#9ca3af">Total Bookings</text>
      <text x="416" y="50" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#fbbf24">1,450+</text>
    </g>

    <!-- Main Overview Section -->
    <g transform="translate(20, 130)">
      <!-- Left: Fleet Map & Real-Time Tracking -->
      <rect x="0" y="0" width="370" height="250" rx="10" fill="#090e17" stroke="#1f2937" stroke-width="1" />
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Live Fleet Radar (Nawalparasi &amp; Butwal)</text>
      
      <!-- Mini Map Area -->
      <rect x="14" y="36" width="342" height="198" rx="8" fill="#0f172a" />
      <g stroke="#1e293b" stroke-width="1" opacity="0.5">
        <line x1="14" y1="90" x2="356" y2="90" />
        <line x1="14" y1="150" x2="356" y2="150" />
        <line x1="100" y1="36" x2="100" y2="234" />
        <line x1="200" y1="36" x2="200" y2="234" />
      </g>
      <!-- Road network -->
      <path d="M 20 180 Q 150 160 220 90 T 350 70" fill="none" stroke="#334155" stroke-width="8" />
      <path d="M 120 234 L 120 36" fill="none" stroke="#334155" stroke-width="6" />

      <!-- Fleet GPS Pins -->
      <g transform="translate(80, 150)">
        <circle cx="0" cy="0" r="12" fill="#10b981" fill-opacity="0.3" />
        <circle cx="0" cy="0" r="6" fill="#10b981" />
      </g>
      <g transform="translate(190, 115)">
        <circle cx="0" cy="0" r="12" fill="#38bdf8" fill-opacity="0.3" />
        <circle cx="0" cy="0" r="6" fill="#38bdf8" />
      </g>
      <g transform="translate(290, 80)">
        <circle cx="0" cy="0" r="12" fill="#10b981" fill-opacity="0.3" />
        <circle cx="0" cy="0" r="6" fill="#10b981" />
      </g>

      <!-- Right: Recent Activity / Bookings -->
      <rect x="385" y="0" width="195" height="250" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <text x="400" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Live Bookings</text>

      <!-- Booking Item 1 -->
      <rect x="395" y="38" width="175" height="56" rx="8" fill="#1f2937" />
      <text x="405" y="56" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">Sedan • 3 Days Rental</text>
      <text x="405" y="72" font-family="'Inter', sans-serif" font-size="9" fill="#10b981">● Confirmed &amp; Dispatched</text>
      <text x="405" y="86" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9ca3af">Bardaghat → Pokhara</text>

      <!-- Booking Item 2 -->
      <rect x="395" y="104" width="175" height="56" rx="8" fill="#1f2937" />
      <text x="405" y="122" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">SUV 4x4 • 1 Day</text>
      <text x="405" y="138" font-family="'Inter', sans-serif" font-size="9" fill="#38bdf8">● In Progress</text>
      <text x="405" y="152" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9ca3af">Butwal → Nawalparasi</text>

      <!-- Booking Item 3 -->
      <rect x="395" y="170" width="175" height="56" rx="8" fill="#1f2937" />
      <text x="405" y="188" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">Electric Commute</text>
      <text x="405" y="204" font-family="'Inter', sans-serif" font-size="9" fill="#10b981">● Completed</text>
      <text x="405" y="218" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9ca3af">Trip Fare: Rs 650</text>
    </g>
  </g>
</svg>
